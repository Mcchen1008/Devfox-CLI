name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（例如 v0.2.0，会作为 git tag 与 Release 名称）
        required: true
        type: string
      prerelease:
        description: 是否为预览版（prerelease）
        required: false
        default: false
        type: boolean
      description:
        description: 发行版简介（写入 Release 正文）
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.24"
  BINARY_NAME: devfox
  PACKAGE_NAME: devfox-go

jobs:
  build:
    name: Build (linux / ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            arch_label: x64
          - goarch: "386"
            arch_label: x86-32
          - goarch: arm64
            arch_label: armv8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p artifacts
          output="artifacts/${{ env.BINARY_NAME }}-linux-${{ matrix.goarch }}"
          go build -trimpath -ldflags="-s -w" -o "$output" .
          file "$output"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-${{ matrix.goarch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Package & Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries/
          pattern: binary-linux-*
          merge-multiple: false

      # 按架构分别打包：3 个架构 zip + 1 个源代码 zip
      - name: Stage & package per-arch zips
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION_NUM="${VERSION#v}"

          # ---------- 1) 三个架构各自的独立 zip ----------
          for arch in amd64 386 arm64; do
            ARCH_DIR="${PACKAGE_NAME}-${VERSION_NUM}-linux-${arch}"
            mkdir -p "$ARCH_DIR/bin"

            # 二进制
            cp "binaries/binary-linux-${arch}/${BINARY_NAME}-linux-${arch}" \
               "$ARCH_DIR/bin/${BINARY_NAME}"
            chmod +x "$ARCH_DIR/bin/${BINARY_NAME}"

            # 必要运行时组件：config / skills（main.go 期望 ../config 与 ../skills 相对二进制）
            cp -r config "$ARCH_DIR/config"
            cp -r skills "$ARCH_DIR/skills"

            # 文档
            cp README.md LICENSE "$ARCH_DIR/"

            # 该架构的说明文件
            {
              echo "# ${PACKAGE_NAME} ${VERSION} (linux ${arch})"
              echo ""
              echo "${{ inputs.description }}"
              echo ""
              echo "## 目录结构"
              echo "- \`bin/${BINARY_NAME}\` 预编译二进制（linux ${arch}）"
              echo "- \`config/\` 运行时配置（config.json、limits.json）"
              echo "- \`skills/\` 技能目录"
              echo "- \`README.md\` / \`LICENSE\`"
              echo ""
              echo "## 运行"
              echo '```bash'
              echo "cd bin"
              echo "./${BINARY_NAME}"
              echo '```'
              echo ""
              echo "## 校验"
              echo '```bash'
              echo "sha256sum -c ${PACKAGE_NAME}-${VERSION_NUM}-linux-${arch}.zip.sha256"
              echo '```'
            } > "$ARCH_DIR/README.md"

            # 打包 zip（用 zip 命令：保留 Unix 可执行权限位，
            # 避免 Python zipfile 解压后二进制失去 x 权限）
            zip -q -r "${PACKAGE_NAME}-${VERSION_NUM}-linux-${arch}.zip" "$ARCH_DIR"
            sha256sum "${PACKAGE_NAME}-${VERSION_NUM}-linux-${arch}.zip" > \
              "${PACKAGE_NAME}-${VERSION_NUM}-linux-${arch}.zip.sha256"
          done

          # ---------- 2) 源代码 zip（git archive 直接输出 zip 格式） ----------
          git archive \
            --format=zip \
            --prefix="${PACKAGE_NAME}-${VERSION_NUM}-src/" \
            -o "${PACKAGE_NAME}-${VERSION_NUM}-src.zip" \
            HEAD
          sha256sum "${PACKAGE_NAME}-${VERSION_NUM}-src.zip" > \
            "${PACKAGE_NAME}-${VERSION_NUM}-src.zip.sha256"

          # 列出产物，供后续步骤引用
          ls -lh *.zip *.sha256
          echo "archive_prefix=${PACKAGE_NAME}-${VERSION_NUM}" >> "$GITHUB_ENV"

      - name: Create tag
        run: |
          git tag "${{ inputs.version }}" 2>/dev/null || true
          git push origin "${{ inputs.version }}" 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: |
            ${{ inputs.description }}

            ## 下载

            本发行版包含 4 个 zip 压缩包：

            ### 预编译二进制（3 个架构包）
            - `${{ env.archive_prefix }}-linux-amd64.zip` — linux x64
            - `${{ env.archive_prefix }}-linux-386.zip` — linux x86-32
            - `${{ env.archive_prefix }}-linux-arm64.zip` — linux armv8

            每个架构包内均含：
            - `bin/devfox` 预编译二进制
            - `config/` 运行时配置（config.json、limits.json）
            - `skills/` 技能目录
            - `README.md`、`LICENSE`

            ### 源代码
            - `${{ env.archive_prefix }}-src.zip` — 完整源代码

            每个 zip 均附 `.sha256` 校验文件。
          prerelease: ${{ inputs.prerelease }}
          files: |
            ${{ env.archive_prefix }}-linux-amd64.zip
            ${{ env.archive_prefix }}-linux-amd64.zip.sha256
            ${{ env.archive_prefix }}-linux-386.zip
            ${{ env.archive_prefix }}-linux-386.zip.sha256
            ${{ env.archive_prefix }}-linux-arm64.zip
            ${{ env.archive_prefix }}-linux-arm64.zip.sha256
            ${{ env.archive_prefix }}-src.zip
            ${{ env.archive_prefix }}-src.zip.sha256
